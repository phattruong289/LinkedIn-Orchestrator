<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  /* Cover: logo, optional chip, headline, optional mono subtitle, swipe cue, footer.
     Headline can run in either family — mono reads quieter and more technical,
     display reads louder. Real decks use both depending on the post. */
  /* the centre lift is a diffuse glow, not a visible card — in the source decks
     you read it as light behind the text rather than a panel edge */
  .panel {
    position: absolute;
    left: 96px; right: 96px;
    top: 50%;
    transform: translateY(-50%);
    padding: 70px 30px;
  }
  .panel::before {
    content: "";
    position: absolute;
    inset: -30px -10px;
    border-radius: 40px;
    background: radial-gradient(ellipse at 50% 50%,
                rgba(255,255,255,.075) 0%, rgba(255,255,255,.04) 45%, transparent 78%);
    filter: blur(14px);
  }
  h1 {
    margin: 0;
    text-align: center;
    color: var(--text);
  }
  h1.mono    { font: 700 76px/1.34 "P3Mono", monospace; letter-spacing: -.01em; }
  h1.display { font: 700 92px/1.1  "P3Display", sans-serif; text-transform: uppercase; letter-spacing: .01em; }

  .sub {
    margin: 30px 0 0;
    text-align: center;
    font: 700 30px/1.5 "P3Mono", monospace;
    color: var(--text);
  }
  .chipwrap { text-align: center; margin: 0 0 34px; }

  .sparkle { position: absolute; }
  .sparkle svg { display: block; }
</style>

<div class="slide" id="slide">
  <div class="stars"></div>
  <div class="bokeh"></div>

  <img class="logo" src="play3-logo.svg" alt="">

  <!-- the 4-point sparkles that bracket the top of most covers -->
  <div class="sparkle" style="left:52px;top:34px">
    <svg width="58" height="58" viewBox="0 0 100 100"><path d="M50 0 L55.5 44.5 L100 50 L55.5 55.5 L50 100 L44.5 55.5 L0 50 L44.5 44.5 Z" fill="#fff" opacity=".92"/></svg>
  </div>
  <div class="sparkle" style="right:52px;top:34px">
    <svg width="58" height="58" viewBox="0 0 100 100"><path d="M50 0 L55.5 44.5 L100 50 L55.5 55.5 L50 100 L44.5 55.5 L0 50 L44.5 44.5 Z" fill="#fff" opacity=".92"/></svg>
  </div>

  <div class="panel">
    <div class="chipwrap" id="chipwrap" hidden><span class="chip" id="chip"></span></div>
    <h1 id="headline"></h1>
    <p class="sub" id="sub" hidden></p>
  </div>

  <div class="swipe">
    <svg viewBox="0 0 150 14">
      <path d="M0 7 H138" stroke="#adff00" stroke-width="2" fill="none"/>
      <path d="M132 1.5 L142 7 L132 12.5" stroke="#adff00" stroke-width="2" fill="none"/>
    </svg>
  </div>

  <div class="footer" id="footer" hidden></div>
</div>

<script src="starfield.js"></script>
<script>
  // ---- slide spec -----------------------------------------------------------
  // This is what strategist-writer would emit. `accent` marks the words that go
  // green — green marks the thing that matters, so keep it to one or two.
  const SPEC = {
    type: "cover",
    font: "mono",                       // "mono" | "display"
    // "\n" forces a line break. Headlines in the source decks are broken by hand
    // for rhythm, not left to auto-wrap — where the line lands changes the read.
    headline: "We Lifted Every\nSingle Metric\nIn Roblox.\nZero Dev Work.",
    accent: ["Lifted", "Zero"],
    chip: null,                         // e.g. "CASE STUDY"
    subtitle: null,
    footer: null,                       // e.g. "Play3 | Goal Driven AI agents for interactive worlds"
    seed: 20260730,
  };
  // ---------------------------------------------------------------------------

  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

  // wrap each accent word in <span class="a"> — matched on word boundaries so
  // "Zero" doesn't also colour "Zeroed"
  function paint(text, words) {
    let out = esc(text);
    for (const w of words || []) {
      out = out.replace(new RegExp(`\\b${esc(w)}\\b`, "g"), `<span class="a">${esc(w)}</span>`);
    }
    return out.replace(/\n/g, "<br>");
  }

  const h = document.getElementById("headline");
  h.className = SPEC.font === "display" ? "display" : "mono";
  h.innerHTML = paint(SPEC.headline, SPEC.accent);

  if (SPEC.chip) {
    document.getElementById("chip").textContent = SPEC.chip;
    document.getElementById("chipwrap").hidden = false;
  }
  if (SPEC.subtitle) {
    const s = document.getElementById("sub");
    s.innerHTML = paint(SPEC.subtitle, SPEC.accent);
    s.hidden = false;
  }
  if (SPEC.footer) {
    const f = document.getElementById("footer");
    f.textContent = SPEC.footer;
    f.hidden = false;
  }

  PLAY3_starfield(document.getElementById("slide"), SPEC.seed);
</script>

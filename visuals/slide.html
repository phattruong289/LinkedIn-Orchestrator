<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  /* One template, five slide types, switched on SPEC.type. Kept in a single file so
     the shared furniture (background, logo, swipe cue, footer) exists once and every
     type inherits the same treatment automatically. */

  /* diffuse centre lift — light behind the text, not a card with an edge */
  .lift { position: absolute; left: 96px; right: 96px; top: 50%; transform: translateY(-50%); padding: 70px 30px; }
  .lift::before {
    content: ""; position: absolute; inset: -30px -10px; border-radius: 40px;
    background: radial-gradient(ellipse at 50% 50%, rgba(255,255,255,.075) 0%, rgba(255,255,255,.04) 45%, transparent 78%);
    filter: blur(14px);
  }

  h1 { margin: 0; text-align: center; color: var(--text); }
  h1.mono    { font: 700 76px/1.34 "P3Mono", monospace; letter-spacing: -.01em; }
  h1.display { font: 700 88px/1.1 "P3Display", sans-serif; text-transform: uppercase; }

  /* headline pinned to the top, used by the body slide types */
  h2.top {
    position: absolute; top: 132px; left: 70px; right: 70px; margin: 0;
    text-align: center; color: var(--text);
    font: 700 72px/1.12 "P3Display", sans-serif; text-transform: uppercase;
  }

  .sub { margin: 30px 0 0; text-align: center; font: 700 30px/1.5 "P3Mono", monospace; color: var(--text); }
  .chipwrap { text-align: center; margin: 0 0 34px; }
  .sparkle { position: absolute; }
  .sparkle svg { display: block; }

  /* ---- numbered list ---------------------------------------------------- */
  .cards { position: absolute; left: 118px; right: 118px; top: 330px; }
  /* chamfered corners, as in the source decks. Two layers rather than a border,
     because clip-path cuts a CSS border off at the chamfers and leaves the card
     looking torn — the outer layer *is* the border. */
  .card {
    position: relative; margin-bottom: 30px; padding: 2px;
    background: rgba(173, 255, 0, .55);
    clip-path: polygon(0 0, calc(100% - 30px) 0, 100% 30px, 100% 100%, 30px 100%, 0 calc(100% - 30px));
  }
  .card > .inner {
    display: flex; align-items: center; gap: 44px; padding: 38px 44px;
    background: #131c04;
    clip-path: polygon(0 0, calc(100% - 29px) 0, 100% 29px, 100% 100%, 29px 100%, 0 calc(100% - 29px));
  }
  .card .n { font: 700 82px/1 "P3Mono", monospace; color: #fff; opacity: .92; min-width: 130px; }
  .card .t { font: 500 31px/1.3 "P3Body", sans-serif; color: rgba(255,255,255,.92); }

  /* ---- metric stack ------------------------------------------------------ */
  .metrics {
    position: absolute; left: 76px; right: 76px; top: 330px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 52px 56px; text-align: center;
  }
  .metrics .m .v { font: 900 88px/1 "P3Figure", sans-serif; color: var(--accent); letter-spacing: -.02em; }
  .metrics .m .l { margin-top: 12px; font: 500 30px/1.25 "P3Body", sans-serif; color: #fff; }
  .metrics .m.wide { grid-column: 1 / -1; }
  /* without a chart there's no floor to sit on, so centre the block instead of
     leaving the lower half empty — charts need real series data and often won't exist */
  .metrics.nochart { top: 58%; transform: translateY(-50%); }
  /* the chart is a floor, not a feature — it should read as a horizon line */
  .chart { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; opacity: .85; }
  .chart svg { display: block; width: 100%; height: 100%; }
  /* lift the swipe cue clear of the chart when one is present */
  .swipe.raised { bottom: 196px; }

  /* ---- before → after ---------------------------------------------------- */
  /* sits lower than the other body types because there's no screenshot beneath it —
     the source deck put a dashboard capture here, which we omit rather than fake */
  .compare {
    position: absolute; left: 90px; right: 90px; top: 440px;
    border: 1.5px solid rgba(255,255,255,.5); border-radius: 22px; padding: 54px 30px 48px;
  }
  .compare .cap {
    position: absolute; top: -19px; left: 50%; transform: translateX(-50%);
    background: #000; padding: 0 22px; font: 500 30px/1 "P3Body", sans-serif; color: #fff; white-space: nowrap;
  }
  .compare .row { display: flex; align-items: center; justify-content: center; gap: 40px; }
  .compare .side { flex: 1; text-align: center; }
  .compare .side .v { font: 900 98px/1 "P3Figure", sans-serif; color: var(--accent); }
  .compare .side .l { margin-top: 10px; font: 500 32px/1.2 "P3Body", sans-serif; color: #fff; }
  .compare .side .n { margin-top: 4px; font: italic 500 27px/1.2 "P3Body", sans-serif; color: rgba(255,255,255,.8); }
  .compare .gt { font: 900 62px/1 "P3Figure", sans-serif; color: #fff; }
  .sticker {
    position: absolute; right: 46px; top: 300px; transform: rotate(-7deg);
    background: var(--sticker); color: #fff; padding: 18px 30px; border-radius: 14px;
    font: 500 34px/1 "P3Body", sans-serif; white-space: nowrap;
  }

  /* ---- media (one real, sourced image, held in-brand) ------------------- */
  /* The image is framed rather than full-bleed so a non-square capture
     letterboxes cleanly instead of cropping out its point. Every media slide
     carries a visible source credit: the image is sourced, never generated, and
     must depict what the copy claims — see brand-kit.md and the guardrails. */
  .media { position: absolute; left: 84px; right: 84px; top: 300px; }
  .media .frame {
    height: 540px; border-radius: 22px; overflow: hidden; background: #0e0e0e;
    border: 2px solid rgba(173,255,0,.5);
    display: flex; align-items: center; justify-content: center;
  }
  .media .frame img { width: 100%; height: 100%; object-fit: contain; }
  .media .frame.cover img { object-fit: cover; }
  .media .cap { margin-top: 18px; text-align: center; font: 500 30px/1.3 "P3Body", sans-serif; color: #fff; }
  .media .credit { margin-top: 8px; text-align: center; font: 500 23px/1.3 "P3Body", sans-serif; color: var(--muted); }

  /* ---- cta --------------------------------------------------------------- */
  /* CTA carries two stacked headlines, so it runs a size down to stay on two lines each */
  h1.cta { font-size: 66px; }
  .bolt { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%) rotate(14deg); width: 620px; opacity: .11; }
  .btn {
    position: absolute; left: 50%; bottom: 178px; transform: translateX(-50%);
    display: inline-flex; align-items: center; gap: 14px;
    background: var(--accent); color: #000; padding: 26px 46px; border-radius: 16px;
    font: 700 36px/1 "P3Mono", monospace; white-space: nowrap;
  }
  .cursor { position: absolute; left: 50%; bottom: 150px; margin-left: 118px; width: 40px; }

  /* Deck mode: every slide becomes its own square page so print-to-PDF yields
     one 1080x1080 page per slide with no margin and no header/footer. */
  @page { size: 1080px 1080px; margin: 0; }
  /* Deck mode's layout overrides are applied inline by the script rather than through a
     body class. The single-slide page is a fixed 1080 box with overflow hidden on both
     <html> and <body>, and both have to be released or everything after slide one is
     clipped away — which is how this first produced a one-page PDF. */
</style>

<template id="tpl"><div class="slide">
  <div class="stars"></div>
  <div class="bokeh"></div>
  <div class="glow" data-r="glow" hidden></div>
  <img class="bolt" data-r="bolt" src="play3-bolt.svg" alt="" hidden>

  <img class="logo" data-r="logo" src="play3-logo.svg" alt="">

  <div class="sparkle" data-r="sparkleL" hidden style="left:52px;top:34px">
    <svg width="58" height="58" viewBox="0 0 100 100"><path d="M50 0 L55.5 44.5 L100 50 L55.5 55.5 L50 100 L44.5 55.5 L0 50 L44.5 44.5 Z" fill="#fff" opacity=".92"/></svg>
  </div>
  <div class="sparkle" data-r="sparkleR" hidden style="right:52px;top:34px">
    <svg width="58" height="58" viewBox="0 0 100 100"><path d="M50 0 L55.5 44.5 L100 50 L55.5 55.5 L50 100 L44.5 55.5 L0 50 L44.5 44.5 Z" fill="#fff" opacity=".92"/></svg>
  </div>

  <div data-r="body"></div>

  <div class="swipe" data-r="swipe" hidden>
    <svg viewBox="0 0 150 14">
      <path d="M0 7 H138" stroke="#adff00" stroke-width="2" fill="none"/>
      <path d="M132 1.5 L142 7 L132 12.5" stroke="#adff00" stroke-width="2" fill="none"/>
    </svg>
  </div>

  <div class="footer" data-r="footer" hidden></div>
</div></template>
<div id="stage"></div>


<script src="starfield.js"></script>
<script src="spec.js"></script>
<script>
// Renders one slide (window.SPEC) for PNG capture, or a whole deck (window.DECK)
// stacked one-per-page for print-to-PDF. Same builder either way, so a slide can
// never look different depending on which output it came from.

const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

// green marks what matters — accent words match on word boundaries so a partial
// match doesn't colour a longer word
function paint(text, words) {
  let out = esc(text);
  for (const w of words || []) {
    const safe = String(w).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    // Only assert a boundary on an end that actually is a word character. An accent like
    // "Stated," ends in punctuation, and \b after a comma never matches — which made the
    // highlight fail silently rather than error. Silent is the dangerous part.
    const lead = /^\w/.test(w) ? "\\b" : "";
    const tail = /\w$/.test(w) ? "\\b" : "";
    out = out.replace(new RegExp(lead + safe + tail, "g"), '<span class="a">' + esc(w) + "</span>");
  }
  return out.replace(/\n/g, "<br>");
}

// polyline chart from a real series, normalised to the box
function chart(series) {
  const w = 1080, h = 150, pad = 12;
  const max = Math.max(...series), min = Math.min(...series);
  const span = max - min || 1;
  const pts = series.map((v, i) => {
    const x = (i / (series.length - 1)) * w;
    const y = h - pad - ((v - min) / span) * (h - pad * 2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polygon points="0,${h} ${pts.join(" ")} ${w},${h}" fill="rgba(173,255,0,.16)"/>
    <polyline points="${pts.join(" ")}" fill="none" stroke="#adff00" stroke-width="3"/>
  </svg>`;
}

function buildSlide(S) {
  const el = document.getElementById("tpl").content.firstElementChild.cloneNode(true);
  const r = (n) => el.querySelector(`[data-r="${n}"]`);
  const body = r("body");

  switch (S.type) {
    case "cover":
      r("sparkleL").hidden = false;
      r("sparkleR").hidden = false;
      body.innerHTML = `<div class="lift">
        ${S.chip ? `<div class="chipwrap"><span class="chip">${esc(S.chip)}</span></div>` : ""}
        <h1 class="${S.font === "display" ? "display" : "mono"}">${paint(S.headline, S.accent)}</h1>
        ${S.subtitle ? `<p class="sub">${paint(S.subtitle, S.accent)}</p>` : ""}
      </div>`;
      break;

    case "list":
      r("logo").hidden = true;
      body.innerHTML = `<h2 class="top">${paint(S.headline, S.accent)}</h2>
        <div class="cards">${(S.items || []).map((t, i) =>
          `<div class="card"><div class="inner"><div class="n">${String(i + 1).padStart(2, "0")}</div><div class="t">${esc(t)}</div></div></div>`
        ).join("")}</div>`;
      break;

    case "metrics": {
      r("logo").hidden = true;
      r("glow").hidden = false;
      const ms = S.metrics || [];
      const odd = ms.length % 2 === 1;
      body.innerHTML = `<h2 class="top">${paint(S.headline, S.accent)}</h2>
        <div class="metrics${S.chart ? "" : " nochart"}">${ms.map((m, i) =>
          `<div class="m ${odd && i === ms.length - 1 ? "wide" : ""}">
             <div class="v">${esc(m.value)}</div><div class="l">${esc(m.label)}</div></div>`
        ).join("")}</div>
        ${S.chart ? `<div class="chart">${chart(S.chart)}</div>` : ""}`;
      if (S.chart) r("swipe").classList.add("raised");
      break;
    }

    case "compare":
      r("logo").hidden = true;
      body.innerHTML = `<h2 class="top">${paint(S.headline, S.accent)}</h2>
        ${S.sticker ? `<div class="sticker">${esc(S.sticker)}</div>` : ""}
        <div class="compare">
          ${S.caption ? `<div class="cap">${esc(S.caption)}</div>` : ""}
          <div class="row">
            <div class="side"><div class="v">${esc(S.from.value)}</div><div class="l">${esc(S.from.label)}</div>
              ${S.from.note ? `<div class="n">(${esc(S.from.note)})</div>` : ""}</div>
            <div class="gt">&gt;</div>
            <div class="side"><div class="v">${esc(S.to.value)}</div><div class="l">${esc(S.to.label)}</div>
              ${S.to.note ? `<div class="n">(${esc(S.to.note)})</div>` : ""}</div>
          </div>
        </div>`;
      break;

    case "media":
      r("logo").hidden = true;
      // The image is assumed present: a media slide with no cleared image is
      // demoted to a text slide upstream, not rendered with an empty frame.
      body.innerHTML = `<h2 class="top">${paint(S.headline, S.accent)}</h2>
        <div class="media">
          <div class="frame ${S.fit === "cover" ? "cover" : ""}"><img src="${esc(S.image)}" alt=""></div>
          ${S.caption ? `<div class="cap">${esc(S.caption)}</div>` : ""}
          ${S.credit ? `<div class="credit">${esc(S.credit)}</div>` : ""}
        </div>`;
      break;

    case "cta":
      r("bolt").hidden = false;
      body.innerHTML = `<div class="lift">
        <h1 class="mono cta">${paint(S.headline, S.accent)}</h1>
        ${S.payoff ? `<h1 class="mono cta a halo" style="margin-top:26px">${esc(S.payoff).replace(/\n/g, "<br>")}</h1>` : ""}
      </div>
      ${S.button ? `<div class="btn">${esc(S.button)}</div>
        <svg class="cursor" viewBox="0 0 24 24" fill="#fff"><path d="M4 2 L4 20 L9 15 L12 22 L15 20.5 L12 14 L19 14 Z"/></svg>` : ""}`;
      break;
  }

  // swipe cue on every slide except the last; a CTA never carries one
  if (S.swipe && S.type !== "cta") r("swipe").hidden = false;
  if (S.footer) { const f = r("footer"); f.textContent = S.footer; f.hidden = false; }

  return el;
}

const stage = document.getElementById("stage");
const isDeck = Array.isArray(window.DECK);
const deck = isDeck ? window.DECK
  : (window.SPEC ? [window.SPEC] : [{ type: "cover", headline: "No spec loaded", seed: 1 }]);

if (isDeck) {
  for (const node of [document.documentElement, document.body]) {
    node.style.height = "auto";
    node.style.overflow = "visible";
  }
}

deck.forEach((S, i) => {
  const el = buildSlide(S);
  // one square page per slide; the last one mustn't add a trailing blank page
  if (isDeck && i < deck.length - 1) {
    el.style.breakAfter = "page";
    el.style.pageBreakAfter = "always";
  }
  stage.appendChild(el);
  PLAY3_starfield(el, S.seed || 1);
});
</script>
